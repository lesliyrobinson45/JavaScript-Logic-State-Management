<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern task management application with local storage">
    <title>TaskFlow - Modern To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="icon">✓</span>
                    TaskFlow
                </h1>
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <!-- Statistics Dashboard -->
        <section class="stats-dashboard" role="region" aria-label="Task statistics">
            <div class="stat-card">
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="activeTasks">0</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </section>

        <!-- Task Input Section -->
        <section class="task-input-section">
            <form id="taskForm" class="task-form">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="What needs to be done?"
                        aria-label="Task description"
                        autocomplete="off"
                        required
                    >
                    <button type="submit" class="btn btn-primary" aria-label="Add task">
                        <span class="btn-text">Add Task</span>
                        <span class="btn-icon">+</span>
                    </button>
                </div>
                
                <div class="task-options">
                    <div class="option-group">
                        <label for="prioritySelect" class="option-label">Priority:</label>
                        <select id="prioritySelect" class="priority-select" aria-label="Task priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    
                    <div class="option-group">
                        <label for="dueDateInput" class="option-label">Due Date:</label>
                        <input 
                            type="date" 
                            id="dueDateInput" 
                            class="date-input"
                            aria-label="Task due date"
                        >
                    </div>
                </div>
            </form>
        </section>

        <!-- Search and Filter Section -->
        <section class="controls-section">
            <div class="search-container">
                <input 
                    type="search" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search tasks..."
                    aria-label="Search tasks"
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
            </div>

            <div class="filter-buttons" role="group" aria-label="Filter tasks">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <button type="button" id="clearCompleted" class="btn btn-secondary">
                Clear Completed
            </button>
        </section>

        <!-- Tasks List -->
        <section class="tasks-section" role="region" aria-label="Tasks list">
            <div id="tasksList" class="tasks-list"></div>
            
            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📝</div>
                <h2 class="empty-title">No tasks yet</h2>
                <p class="empty-message">Add your first task to get started!</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
