<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Database Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 2rem;
        }

        h1 {
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .stats {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
        }

        .stat {
            font-size: 0.9rem;
            color: #666;
        }

        .stat strong {
            color: #333;
            font-size: 1.5rem;
            display: block;
        }

        .controls {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .status {
            flex: 1;
            text-align: right;
            color: #666;
        }

        .status.connected {
            color: #10b981;
            font-weight: 600;
        }

        .status.error {
            color: #ef4444;
            font-weight: 600;
        }

        .data-container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .json-viewer {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 1.5rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            max-height: 600px;
            overflow-y: auto;
        }

        .task-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.75rem;
        }

        .task-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #111827;
        }

        .task-completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .task-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .priority-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .priority-high {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .priority-medium {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .priority-low {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .view-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .view-btn {
            padding: 0.5rem 1rem;
            background: #f3f4f6;
            color: #6b7280;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
        }

        .view-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #9ca3af;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #667eea;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗄️ TaskFlow Database Viewer</h1>
            <p>Real-time view of your MongoDB database</p>
            <div class="stats">
                <div class="stat">
                    <strong id="totalCount">0</strong>
                    Total Tasks
                </div>
                <div class="stat">
                    <strong id="activeCount">0</strong>
                    Active
                </div>
                <div class="stat">
                    <strong id="completedCount">0</strong>
                    Completed
                </div>
            </div>
        </div>

        <div class="controls">
            <button onclick="loadData()">🔄 Refresh Data</button>
            <button onclick="window.open('http://localhost:3000', '_blank')">🚀 Open App</button>
            <div class="status" id="status">Click Refresh to load data</div>
        </div>

        <div class="data-container">
            <div class="view-toggle">
                <button class="view-btn active" onclick="switchView('cards')" id="cardsBtn">📋 Card View</button>
                <button class="view-btn" onclick="switchView('json')" id="jsonBtn">{ } JSON View</button>
            </div>

            <div id="cardsView"></div>
            <div id="jsonView" style="display: none;"></div>
        </div>
    </div>

    <script>
        let currentView = 'cards';
        let tasksData = [];

        async function loadData() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Loading...';
            statusEl.className = 'status';

            try {
                const response = await fetch('http://localhost:3000/api/tasks');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }

                tasksData = await response.json();
                
                statusEl.textContent = `✅ Connected - Last updated: ${new Date().toLocaleTimeString()}`;
                statusEl.className = 'status connected';

                updateStats();
                renderView();
            } catch (error) {
                console.error('Error loading data:', error);
                statusEl.textContent = '❌ Error: Cannot connect to server. Make sure server is running.';
                statusEl.className = 'status error';
                
                document.getElementById('cardsView').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Cannot Connect to Server</h3>
                        <p>Make sure the server is running on http://localhost:3000</p>
                        <p>Run: <code>npm start</code></p>
                    </div>
                `;
            }
        }

        function updateStats() {
            const total = tasksData.length;
            const active = tasksData.filter(t => !t.completed).length;
            const completed = tasksData.filter(t => t.completed).length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('completedCount').textContent = completed;
        }

        function switchView(view) {
            currentView = view;
            
            document.getElementById('cardsBtn').classList.toggle('active', view === 'cards');
            document.getElementById('jsonBtn').classList.toggle('active', view === 'json');
            
            renderView();
        }

        function renderView() {
            if (currentView === 'cards') {
                renderCardsView();
            } else {
                renderJsonView();
            }
        }

        function renderCardsView() {
            const cardsView = document.getElementById('cardsView');
            const jsonView = document.getElementById('jsonView');
            
            cardsView.style.display = 'block';
            jsonView.style.display = 'none';

            if (tasksData.length === 0) {
                cardsView.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <h3>No Tasks in Database</h3>
                        <p>Add some tasks in the main app to see them here</p>
                    </div>
                `;
                return;
            }

            cardsView.innerHTML = tasksData.map(task => `
                <div class="task-card">
                    <div class="task-header">
                        <div class="task-text ${task.completed ? 'task-completed' : ''}">
                            ${task.completed ? '✓ ' : ''}${escapeHtml(task.text)}
                        </div>
                        <span class="priority-badge priority-${task.priority}">
                            ${task.priority}
                        </span>
                    </div>
                    <div class="task-meta">
                        <span><strong>ID:</strong> ${task._id}</span>
                        <span><strong>Status:</strong> ${task.completed ? 'Completed' : 'Active'}</span>
                        ${task.dueDate ? `<span><strong>Due:</strong> ${formatDate(task.dueDate)}</span>` : ''}
                        <span><strong>Created:</strong> ${formatDate(task.createdAt)}</span>
                        ${task.updatedAt ? `<span><strong>Updated:</strong> ${formatDate(task.updatedAt)}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderJsonView() {
            const cardsView = document.getElementById('cardsView');
            const jsonView = document.getElementById('jsonView');
            
            cardsView.style.display = 'none';
            jsonView.style.display = 'block';

            jsonView.innerHTML = `
                <div class="json-viewer">
                    <pre>${JSON.stringify(tasksData, null, 2)}</pre>
                </div>
            `;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto-load on page load
        window.addEventListener('DOMContentLoaded', loadData);

        // Auto-refresh every 5 seconds
        setInterval(loadData, 5000);
    </script>
</body>
</html>
